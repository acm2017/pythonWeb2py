{{extend 'layout.html'}}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-plus"></i> New Reservation</h1>
    <a href="{{=URL('default', 'reservations')}}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> Back to Reservations
    </a>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5>Reservation Details</h5>
            </div>
            <div class="card-body">
                {{=form}}
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <h5>Instructions</h5>
            </div>
            <div class="card-body">
                <ul class="list-unstyled">
                    <li><i class="fas fa-info-circle text-info"></i> Select the hotel first</li>
                    <li><i class="fas fa-info-circle text-info"></i> Choose an available room</li>
                    <li><i class="fas fa-info-circle text-info"></i> Select or create a guest</li>
                    <li><i class="fas fa-info-circle text-info"></i> Set check-in and check-out dates</li>
                    <li><i class="fas fa-info-circle text-info"></i> Total amount will be calculated automatically</li>
                </ul>
            </div>
        </div>
    </div>
</div>
